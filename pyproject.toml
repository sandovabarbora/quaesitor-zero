[project]
name = "quaesitor-zero"
version = "0.1.2"
description = "Does your data assistant say \"I don't know\" when it cannot know?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["evaluation", "text-to-sql", "data-assistant", "hallucination",
            "selective-prediction", "duckdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# DuckDB parses the DDL and reads the warehouse. Everything else is stdlib, and
# there is deliberately no model SDK: a tool that asks to be trusted about what
# a model does cannot itself depend on one.
dependencies = ["duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quaesitor-zero = "quaesitor_zero.cli:main"

[project.urls]
Homepage = "https://quaesitor.eu"
Source = "https://github.com/sandovabarbora/quaesitor-zero"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quaesitor_zero"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
